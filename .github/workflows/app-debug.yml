name: Build and release color-picker APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: color-picker-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Studio source
        run: unzip -q source.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Prepare standalone APK and complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk color-picker.apk
          mkdir -p release/.github/workflows release/tutorial
          cp source.zip apk-version.txt README.txt color-picker.apk release/
          cp .github/workflows/app-debug.yml release/.github/workflows/
          if [ -d tutorial ] && find tutorial -type f -print -quit | grep -q .; then
            cp -a tutorial/. release/tutorial/
          else
            cp README.txt release/tutorial/README-for-user.txt
          fi
          ( cd release && zip -qr ../color-picker-v1.0.7-FULL-with-APK.zip . )
          unzip -tq color-picker-v1.0.7-FULL-with-APK.zip

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: color-picker-apk
          path: color-picker.apk
          if-no-files-found: error

      - name: Upload Full ZIP as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: color-picker-v1.0.7-FULL-with-APK
          path: color-picker-v1.0.7-FULL-with-APK.zip
          if-no-files-found: error

      - name: Publish only APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v$(tr -d '\r\n ' < apk-version.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Upload the new APK first, preserving the old one if uploading fails.
            gh release upload "$TAG" color-picker.apk --clobber
          else
            gh release create "$TAG" color-picker.apk \
              --title "color-picker $TAG" \
              --notes "Automatically built debug APK for color-picker $TAG. Test APK, not a signed production release."
          fi
          # Remove ALL previously uploaded assets other than color-picker.apk.
          # GitHub's automatic Source code (zip/tar.gz) links are not user-uploaded assets.
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if [ "$asset" != "color-picker.apk" ]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Final uploaded assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
